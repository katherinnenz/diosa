/* ================= ACCESO: correo + contraseña, Google y código ================= */
let AUTH_MODE="entrar";
const GLOGO=`<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>`;
function authForm(o={}){
 if(!cloudOn())return `<p class="tiny">El acceso con cuenta aún no está activo.</p>`;
 const m=o.mode||AUTH_MODE,dk=o.dark?" dark":"";
 if(m==="codigo")return `<div class="auth${dk}" data-mode="codigo">${accesoHtml(!!o.dark)}<button type="button" class="alink c" data-authmode="entrar">← Usar correo y contraseña</button></div>`;
 return `<div class="auth${dk}" data-mode="${m}">
 ${o.tabs===false?"":`<div class="authseg" role="tablist"><button type="button" role="tab" data-authmode="entrar" aria-selected="${m==="entrar"}">Iniciar sesión</button><button type="button" role="tab" data-authmode="registro" aria-selected="${m==="registro"}">Crear cuenta</button></div>`}
 ${CONFIG.google?`<button type="button" class="gbtn-g" data-act="entrarGoogle">${GLOGO}<span>Continuar con Google</span></button><div class="aor"><span>o con tu correo</span></div>`:""}
 <form id="authF" novalidate>
  ${m==="registro"?`<label class="afld"><span>Nombre</span><input id="auN" autocomplete="given-name" value="${esc(S.name)}" placeholder="¿Cómo te llamas?"></label>`:""}
  <label class="afld"><span>Correo</span><input id="auE" type="email" autocomplete="email" inputmode="email" placeholder="tu@correo.com" value="${esc(window._authEmail||"")}"></label>
  <label class="afld"><span>Contraseña</span><span class="pw"><input id="auP" type="password" autocomplete="${m==="registro"?"new-password":"current-password"}" placeholder="${m==="registro"?"Mínimo 8 caracteres":"Tu contraseña"}"><button type="button" class="eye" data-act="verClave">Mostrar</button></span></label>
  ${m==="registro"?"":`<button type="button" class="alink r" data-act="olvide">¿Olvidaste tu contraseña?</button>`}
  <p class="aerr" id="auErr" role="alert"></p>
  <button class="abtn" type="submit" id="auBtn">${m==="registro"?"Crear mi cuenta":"Iniciar sesión"}</button>
 </form>
 ${m==="registro"?`<p class="anote">Al crear tu cuenta aceptas los <a href="#/terminos">Términos</a> y la <a href="#/privacidad">Privacidad</a>.</p>`:""}
 <button type="button" class="alink c" data-authmode="codigo">Prefiero entrar con un código por correo</button>
 </div>`;}
function authMsg(e){const t=String(e&&e.message||"").toLowerCase();
 if(e&&e.status===429||t.includes("rate limit")||t.includes("security purposes"))return "Demasiados intentos. Espera un minuto e inténtalo de nuevo.";
 if(t.includes("invalid login"))return "Correo o contraseña incorrectos.";
 if(t.includes("not confirmed"))return "Primero confirma tu correo: toca el enlace que te enviamos.";
 if(t.includes("already registered")||t.includes("already been registered"))return "Ese correo ya tiene una cuenta. Inicia sesión.";
 if(t.includes("password"))return "La contraseña debe tener al menos 8 caracteres.";
 if(t.includes("signup")&&t.includes("disabled"))return "El registro está desactivado por ahora.";
 if(t.includes("email"))return "Revisa que el correo esté bien escrito.";
 return "Algo salió mal. Inténtalo de nuevo.";}
function authErr(m){const el=document.getElementById("auErr");if(el){el.textContent=m;el.classList.add("on");}else toast(m);}
async function doAuth(){
 const box=document.querySelector(".auth"),m=box?.dataset.mode,email=val("auE"),pass=document.getElementById("auP")?.value||"",btn=document.getElementById("auBtn");
 window._authEmail=email;
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return authErr("Escribe un correo válido.");
 if(pass.length<(m==="registro"?8:1))return authErr(m==="registro"?"La contraseña debe tener al menos 8 caracteres.":"Escribe tu contraseña.");
 const lbl=btn.textContent;btn.disabled=true;btn.textContent=m==="registro"?"Creando tu cuenta…":"Entrando…";
 try{
  if(m==="registro"){const nm=val("auN");if(nm){S.name=nm;save(true);}
   const {data,error}=await SB.auth.signUp({email,password:pass,options:{data:{nombre:nm},emailRedirectTo:CONFIG.sitio+(S.onbDone?"#/hoy":"#/bienvenida")}});
   if(error)throw error;
   if(data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length)throw {message:"already registered"};
   if(!data.session){box.innerHTML=`<div class="asent"><div class="ok">✉️</div><h3>Revisa tu correo</h3><p>Te enviamos un enlace a <b>${esc(email)}</b>. Tócalo para activar tu cuenta y luego vuelve aquí.</p><button type="button" class="abtn sec" data-act="reenviarConf">Reenviar el correo</button><button type="button" class="alink c" data-authmode="entrar">Ya la activé · Iniciar sesión</button></div>`;return;}
  }else{const {error}=await SB.auth.signInWithPassword({email,password:pass});if(error)throw error;}
 }catch(e){console.error(e);authErr(authMsg(e));}
 if(btn&&document.body.contains(btn)){btn.disabled=false;btn.textContent=lbl;}}
async function olvideClave(){const email=val("auE");window._authEmail=email;
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return authErr("Escribe tu correo arriba y vuelve a tocar “¿Olvidaste tu contraseña?”.");
 const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:CONFIG.sitio+"#/nueva-clave"});
 if(error)return authErr(authMsg(error));
 const el=document.getElementById("auErr");if(el){el.textContent="Te enviamos un enlace a "+email+" para crear una contraseña nueva.";el.className="aerr on good";}}
function authPage(title,sub,inner){return `<div class="authpage"><aside class="authside"><a class="logo" href="${href("")}">${MARCA.nombre}</a><div class="authart">${chispaSVG({size:300,mood:"feliz",level:5,live:true})}</div><div class="authcopy"><h2>Tu versión más elevada te está esperando.</h2><p>Tus hábitos, tu calma, tu ciclo y tus metas, guardados en tu cuenta y contigo en cualquier dispositivo.</p></div></aside>
 <main class="authmain"><a class="logo m" href="${href(S.onbDone?"hoy":"")}">${MARCA.nombre}</a><div class="authcard"><h1>${title}</h1>${sub?`<p class="asub">${sub}</p>`:""}${inner}</div><p class="afoot"><a href="${href("terminos")}">Términos</a> · <a href="${href("privacidad")}">Privacidad</a> · <a href="${href(S.onbDone?"hoy":"")}">Volver</a></p></main></div>`;}
function entrar(){
 if(!cloudOn())return authPage("El acceso aún no está activo","Mientras tanto, tu progreso se guarda en este navegador.",`<a class="abtn" href="${href(S.onbDone?"hoy":"bienvenida")}">Continuar</a>`);
 if(SESSION)return authPage("Ya estás dentro","Sesión iniciada como "+esc(userEmail())+".",`<a class="abtn" href="${href(S.onbDone?"hoy":"bienvenida")}">Ir a mi espacio</a><button type="button" class="abtn sec" data-act="cerrarSesion">Cerrar sesión</button>`);
 const reg=AUTH_MODE==="registro";
 return authPage(reg?"Crea tu cuenta":AUTH_MODE==="codigo"?"Entra con un código":"Hola de nuevo",reg?"Guarda tu progreso y úsalo en cualquier dispositivo.":"Inicia sesión para continuar donde lo dejaste.",authForm());}
function nuevaClave(){
 if(!SESSION)return authPage("Enlace vencido","Pide un enlace nuevo desde “¿Olvidaste tu contraseña?”.",`<a class="abtn" href="${href("entrar")}">Ir a iniciar sesión</a>`);
 return authPage("Crea tu contraseña nueva","Para "+esc(userEmail())+".",`<div class="auth"><form id="claveF" novalidate><label class="afld"><span>Contraseña nueva</span><span class="pw"><input id="ncP" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres"><button type="button" class="eye" data-act="verClave">Mostrar</button></span></label><label class="afld"><span>Repítela</span><input id="ncP2" type="password" autocomplete="new-password"></label><p class="aerr" id="auErr" role="alert"></p><button class="abtn" type="submit" id="ncBtn">Guardar contraseña</button></form></div>`);}
async function guardarClave(){const a=document.getElementById("ncP").value,b=document.getElementById("ncP2").value;
 if(a.length<8)return authErr("La contraseña debe tener al menos 8 caracteres.");if(a!==b)return authErr("Las contraseñas no coinciden.");
 const btn=document.getElementById("ncBtn");btn.disabled=true;btn.textContent="Guardando…";
 const {error}=await SB.auth.updateUser({password:a});
 if(error){btn.disabled=false;btn.textContent="Guardar contraseña";return authErr(authMsg(error));}
 toast("✓ Contraseña actualizada");location.hash=S.onbDone?"#/hoy":"#/bienvenida";}
function menuCuenta(){const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
 overlay(`<div class="sheet acct"><div class="acct-h">${chispaSVG({size:56,level:lvl()})}<div><b>${S.name?nombre():"Tu cuenta"}</b><small>${SESSION?esc(userEmail()):"Sin cuenta · progreso solo en este dispositivo"}</small></div><span class="tag">${elev()?"Elevado ✦":"Esencial"}</span></div>
 <nav class="acct-l"><a href="${href("yo")}" data-act="cerrar">👤<span>Mi perfil</span>›</a><a href="${href("yo/evolucion")}" data-act="cerrar">📈<span>Mi evolución</span>›</a>${elev()&&portalUrl()?`<a href="${portalUrl()}" target="_blank" rel="noopener">💳<span>Administrar mi suscripción</span>›</a>`:`<button data-act="plan">✦<span>Plan Elevado</span>›</button>`}<button data-act="temaMenu">${dark?"☀️":"🌙"}<span>${dark?"Tema claro":"Tema oscuro"}</span>›</button></nav>
 ${SESSION?`<button class="abtn out" data-act="cerrarSesion">Cerrar sesión</button>`:cloudOn()?`<a class="abtn" href="${href("entrar")}" data-act="cerrar">Iniciar sesión o crear cuenta</a>`:""}</div>`);}
document.addEventListener("submit",e=>{if(e.target.id==="authF"){e.preventDefault();doAuth();}if(e.target.id==="claveF"){e.preventDefault();guardarClave();}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-authmode]");if(!b)return;e.preventDefault();window._authEmail=val("auE")||window._authEmail;AUTH_MODE=b.dataset.authmode;
 const box=b.closest(".auth");if(route()[0]==="entrar"){render();return;}if(box){const tmp=document.createElement("div");tmp.innerHTML=authForm({dark:box.classList.contains("dark"),mode:AUTH_MODE});box.replaceWith(tmp.firstElementChild);}});
Object.assign(NEWACT,{
 verClave(b){const i=b.parentElement.querySelector("input");const s=i.type==="password";i.type=s?"text":"password";b.textContent=s?"Ocultar":"Mostrar";},
 olvide(){olvideClave();},
 async reenviarConf(b){const {error}=await SB.auth.resend({type:"signup",email:window._authEmail});toast(error?authMsg(error):"✉️ Correo reenviado");},
 menuCuenta(){menuCuenta();},
 temaMenu(){act("tema");cerrarOv();},
 async cerrarSesion(){cerrarOv();await pushSync();if(SB)await SB.auth.signOut();SESSION=null;S=nuevo();try{localStorage.removeItem(LS);}catch(e){}AUTH_MODE="entrar";location.hash="#/entrar";render();toast("Cerraste sesión");}});
