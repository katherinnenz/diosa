<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DIOSA — Tu versión más elevada</title>
<meta name="description" content="Tu sistema personal para construir tu versión más elevada: tareas, hábitos, aprendizaje, cuerpo, dinero, diario y crecimiento personal.">
<meta name="theme-color" content="#FBFAF8">
<meta name="apple-mobile-web-app-title" content="DIOSA">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
 --bg:#FBFAF8;--band:#F2EFEA;--card:#FFFFFF;--ink:#1D1D1F;--ink2:#6E6E73;--ink3:#A1A1A6;--line:rgba(0,0,0,.08);--soft:rgba(0,0,0,.04);
 --black:#1D1D1F;--onblack:#FFFFFF;--or1:#FFB27A;--or2:#FF7A2F;--or3:#EE5A1C;--peach:#F7E4D4;--lilac:#ECE6F3;--mint:#E2EEE6;
 --nav:rgba(251,250,248,.74);--f:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
 --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);--sh:0 1px 2px rgba(0,0,0,.03),0 10px 30px -14px rgba(60,40,20,.14);
 color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--band:#0D0D0E;--card:#1C1C1E;--ink:#F5F5F7;--ink2:#A1A1A6;--ink3:#6E6E73;--line:rgba(255,255,255,.1);--soft:rgba(255,255,255,.06);--black:#F5F5F7;--onblack:#1D1D1F;--peach:#3A281C;--lilac:#29233A;--mint:#1C2B22;--nav:rgba(0,0,0,.72);--sh:0 1px 2px rgba(0,0,0,.5),0 12px 30px -14px rgba(0,0,0,.8);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--band:#0D0D0E;--card:#1C1C1E;--ink:#F5F5F7;--ink2:#A1A1A6;--ink3:#6E6E73;--line:rgba(255,255,255,.1);--soft:rgba(255,255,255,.06);--black:#F5F5F7;--onblack:#1D1D1F;--peach:#3A281C;--lilac:#29233A;--mint:#1C2B22;--nav:rgba(0,0,0,.72);--sh:0 1px 2px rgba(0,0,0,.5),0 12px 30px -14px rgba(0,0,0,.8);color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.47;letter-spacing:-.012em;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--or2);outline-offset:3px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.grad{background:linear-gradient(90deg,var(--or2),var(--or3));-webkit-background-clip:text;background-clip:text;color:transparent}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
.narrow{max-width:760px;margin:0 auto}

/* ---------- navegación global (estilo sitio web) ---------- */
.gnav{position:sticky;top:0;z-index:90;background:var(--nav);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border-bottom:1px solid var(--line)}
.gnav .wrap{display:flex;align-items:center;height:52px;gap:28px}
.logo{font-weight:600;font-size:16px;letter-spacing:.3em;flex:none}
.glinks{display:flex;gap:26px;flex:1;justify-content:center}
.glinks a{font-size:13px;color:var(--ink2);transition:color .2s;padding:6px 0;position:relative}
.glinks a:hover,.glinks a.on{color:var(--ink)}
.glinks a.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1.5px;background:var(--ink);border-radius:2px}
.gright{display:flex;align-items:center;gap:10px;flex:none}
.chip-lv{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink2);padding:5px 10px;border-radius:999px;background:var(--soft)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--or1),var(--or3));flex:none}
.ib{width:34px;height:34px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink2);flex:none;transition:background .2s,color .2s}
.ib:hover{background:var(--soft);color:var(--ink)}
.ib svg{width:17px;height:17px}
.menu-btn{display:none}
.focuspill{display:flex;align-items:center;gap:8px;background:var(--black);color:var(--onblack);border:0;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600}
.focuspill i{width:7px;height:7px;border-radius:50%;background:var(--or2);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.3}}

/* navegación local (sub-sección) */
.lnav{position:sticky;top:52px;z-index:80;background:var(--nav);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border-bottom:1px solid var(--line)}
.lnav .wrap{display:flex;align-items:center;height:54px;gap:20px}
.lnav .ttl{font-size:20px;font-weight:600;letter-spacing:-.02em;flex:none}
.lnav .ll{display:flex;gap:22px;margin-left:auto;overflow-x:auto;scrollbar-width:none;align-items:center}
.lnav .ll::-webkit-scrollbar{display:none}
.lnav .ll a{font-size:12.5px;color:var(--ink2);white-space:nowrap;padding:4px 0}
.lnav .ll a.on{color:var(--ink);font-weight:600}
.lnav .ll a:hover{color:var(--ink)}
.lnav .ll .lk{font-size:10px;margin-left:3px}

/* menú móvil pantalla completa */
.mmenu{position:fixed;inset:0;z-index:150;background:var(--bg);padding:calc(70px + env(safe-area-inset-top,0px)) 32px 40px;overflow:auto;animation:fade .25s ease}
.mmenu a{display:block;font-size:30px;font-weight:600;letter-spacing:-.03em;padding:8px 0;opacity:0;animation:rise .45s var(--ease) forwards;animation-delay:calc(var(--i)*40ms)}
.mmenu small{display:block;font-size:13px;color:var(--ink3);margin:22px 0 4px;font-weight:500}
.mmenu .close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:18px}

/* ---------- tipografía ---------- */
.eyebrow{font-size:14px;font-weight:600;color:var(--or3);margin:0 0 8px;letter-spacing:-.01em}
.h-xl{font-size:clamp(48px,8.4vw,104px);font-weight:600;letter-spacing:-.05em;line-height:.98;margin:0}
.h-l{font-size:clamp(38px,5.4vw,64px);font-weight:600;letter-spacing:-.045em;line-height:1.02;margin:0}
.h-m{font-size:clamp(28px,3.4vw,40px);font-weight:600;letter-spacing:-.035em;line-height:1.08;margin:0}
.h-s{font-size:22px;font-weight:600;letter-spacing:-.025em;line-height:1.15;margin:0}
.h-xs{font-size:17px;font-weight:600;letter-spacing:-.02em;margin:0}
.lead{font-size:clamp(19px,2.1vw,24px);color:var(--ink2);letter-spacing:-.022em;line-height:1.35;margin:14px 0 0}
.muted{color:var(--ink2)}
.tiny{font-size:13px;color:var(--ink3)}
.big{font-size:clamp(36px,3.8vw,52px);font-weight:600;letter-spacing:-.045em;line-height:1}
.mid{font-size:28px;font-weight:600;letter-spacing:-.035em;line-height:1.1}

/* ---------- estructura de página ---------- */
.phead{padding:64px 0 36px}
.phead.center{text-align:center}
.phead .row-end{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.band{background:var(--band)}
.sect{padding:56px 0}
.sect-t{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
main{min-height:60vh;padding-bottom:40px}

/* ---------- tarjetas ---------- */
.tile{background:var(--card);border-radius:28px;padding:30px;box-shadow:var(--sh);position:relative;overflow:hidden}
.tile.blk{background:var(--black);color:var(--onblack);box-shadow:none}
.tile.blk .muted,.tile.blk .tiny{color:color-mix(in srgb,var(--onblack) 62%,transparent)}
.tile.blk .eyebrow{color:var(--or1)}
.tile.peach{background:linear-gradient(160deg,var(--peach),var(--card))}
.tile.lilac{background:linear-gradient(160deg,var(--lilac),var(--card))}
.tile.flat{box-shadow:none;background:var(--soft)}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack>*+*{margin-top:16px}
.gap{height:20px}
.sep{height:1px;background:var(--line);margin:20px 0}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.tag{font-size:12px;font-weight:500;background:var(--soft);border-radius:999px;padding:3px 9px;color:var(--ink2);white-space:nowrap}
.lockbadge{font-size:12px;font-weight:600;color:var(--or3);background:color-mix(in srgb,var(--or1) 18%,transparent);border-radius:999px;padding:3px 9px}
.stat .lbl{font-size:13px;font-weight:500;color:var(--ink2);margin:0 0 12px}

/* ---------- botones ---------- */
.go{display:inline-flex;align-items:center;border:0;background:none;padding:0}
.go span{background:var(--black);color:var(--onblack);border-radius:999px;padding:13px 22px;font-weight:500;font-size:15px;transition:transform .25s var(--ease)}
.go i{width:46px;height:46px;border-radius:50%;background:var(--black);color:var(--onblack);display:grid;place-items:center;font-style:normal;font-size:18px;margin-left:-4px;transition:transform .35s var(--spring)}
.go:hover i{transform:translateX(4px)}
.go:active span{transform:scale(.97)}
.go.or span,.go.or i{background:linear-gradient(135deg,var(--or2),var(--or3));color:#fff}
.go.sm span{padding:10px 18px;font-size:14px}.go.sm i{width:38px;height:38px;font-size:15px}
.btn{border:0;background:var(--black);color:var(--onblack);border-radius:999px;padding:10px 18px;font-weight:500;font-size:14.5px;display:inline-flex;align-items:center;gap:8px;transition:transform .2s var(--ease),opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn.or{background:linear-gradient(135deg,var(--or2),var(--or3));color:#fff}
.btn.lt{background:var(--soft);color:var(--ink)}
.btn.out{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{padding:7px 13px;font-size:13.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.link{background:none;border:0;color:var(--or3);font-weight:500;padding:0;font-size:15px}
.link::after{content:" ›"}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--ink2);transition:.2s}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--soft);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:500;transition:.2s}
.chip[aria-pressed="true"]{background:var(--black);color:var(--onblack)}

/* ---------- animación de entrada ---------- */
.anim>*{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}

/* ---------- visualizaciones ---------- */
.ring{display:block;transform:rotate(-90deg)}
.ring .trk{stroke:var(--line)}
.ring .val{transition:stroke-dashoffset 1s var(--ease)}
.rw{position:relative;flex:none}
.rw .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--or1),var(--or2));transition:width 1s var(--ease)}
.vbars{display:flex;align-items:flex-end;gap:8px;height:130px}
.vbars>div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;min-width:0}
.vbars .col{width:100%;max-width:28px;flex:1;display:flex;align-items:flex-end;gap:3px}
.vbars .col i{flex:1;border-radius:7px;background:linear-gradient(180deg,var(--or1),var(--or2));transition:height 1s var(--ease);min-height:3px}
.vbars .col i.alt{background:var(--line)}
.vbars small{font-size:11px;color:var(--ink3);font-weight:500;height:14px}
.orb{border-radius:50%;background:radial-gradient(circle at 32% 28%,#FFE3C6 0%,var(--or1) 22%,var(--or2) 55%,var(--or3) 86%);box-shadow:0 30px 60px -22px rgba(238,90,28,.55),inset -10px -16px 30px rgba(170,50,0,.22);animation:breathe 6s ease-in-out infinite;flex:none}
@keyframes breathe{50%{transform:scale(1.035)}}
.radar text{font-size:10.5px;fill:var(--ink2);font-family:var(--f)}
.radar .grid{fill:none;stroke:var(--line)}
.radar .shape{fill:url(#gOrA);stroke:#EE5A1C;stroke-width:2;transition:all .8s var(--ease)}
.radar .prev{fill:none;stroke:var(--ink3);stroke-dasharray:4 4;stroke-width:1.2}

/* ---------- inicio público ---------- */
.hero{text-align:center;padding:96px 0 40px}
.hero .lead{max-width:30em;margin:22px auto 36px}
.scene{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;max-width:940px;margin:56px auto 0;text-align:left}
.scene .tile{min-height:220px}
.datecard{grid-row:span 2;display:grid;grid-template-columns:1fr 1fr;padding:0!important;min-height:470px!important}
.datecard .l{background:var(--band);padding:30px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.datecard .l::after{content:"";position:absolute;left:-30%;top:42%;width:160%;height:42%;background:radial-gradient(circle,rgba(255,122,47,.5),transparent 65%);filter:blur(18px)}
.datecard .l>*{position:relative;z-index:1}
.datecard .r{padding:30px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;position:relative}
.datecard .half{position:absolute;left:0;top:50%;transform:translateY(-50%);width:140px;height:280px;border-radius:0 140px 140px 0;background:linear-gradient(180deg,var(--or1),var(--or3))}
.dnum{font-size:62px;font-weight:600;letter-spacing:-.05em;line-height:.95}
.feature{text-align:center;padding:110px 0 30px}
.feature .lead{max-width:28em;margin:18px auto 50px}
.mods{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;text-align:left}
.mod{padding:26px;min-height:200px;display:flex;flex-direction:column;justify-content:space-between}
.mod .e{font-size:30px}
.mod p{margin:6px 0 0;color:var(--ink2);font-size:15px}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;text-align:left}
.pillar{padding:28px;min-height:260px;display:flex;flex-direction:column;justify-content:space-between}
.pillar .e{font-size:32px}
.pillar p{margin:8px 0 0;font-size:15px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:900px;margin:0 auto;text-align:left}
.plan{padding:36px}
.plan ul{list-style:none;padding:0;margin:24px 0 30px}
.plan li{padding:10px 0;border-top:1px solid var(--line);font-size:15.5px;display:flex;gap:10px}
.tile.blk .plan li,.plan.blk li{border-color:color-mix(in srgb,var(--onblack) 14%,transparent)}
.price{font-size:64px;font-weight:600;letter-spacing:-.055em;line-height:1;margin:16px 0 4px}

/* ---------- pie de página ---------- */
.foot{background:var(--band);font-size:12px;color:var(--ink2);padding:40px 0 50px;margin-top:40px}
.foot .cols{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;margin:22px 0 26px}
.foot h4{font-size:12px;font-weight:600;color:var(--ink);margin:0 0 10px}
.foot a{display:block;padding:3px 0;color:var(--ink2)}
.foot a:hover{color:var(--ink);text-decoration:underline}
.foot .legal{border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

/* ---------- bienvenida (cristal sobre atardecer) ---------- */
.sunset{min-height:100vh;background:linear-gradient(180deg,#9B8BB0 0%,#C49DA6 32%,#EBA67A 68%,#F2793B 100%);display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}
.sunset::before{content:"";position:absolute;width:520px;height:720px;border-radius:50% 50% 40% 40%;background:#140F0E;left:50%;bottom:-270px;transform:translateX(-30%);opacity:.92}
.sunset::after{content:"";position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,230,200,.6),transparent 70%);left:16%;top:18%;filter:blur(30px)}
.gcard{position:relative;z-index:2;width:100%;max-width:420px;background:rgba(50,34,30,.34);-webkit-backdrop-filter:blur(34px) saturate(140%);backdrop-filter:blur(34px) saturate(140%);border:1px solid rgba(255,255,255,.22);border-radius:38px;padding:24px 24px 26px;color:#fff;box-shadow:0 40px 80px -30px rgba(0,0,0,.5);animation:rise .6s var(--ease) both}
.gtop{display:flex;align-items:center;gap:14px;margin-bottom:30px}
.gtop button,.gtop a{background:none;border:0;color:#fff;font-size:20px;width:30px;height:30px;padding:0;display:grid;place-items:center}
.slider{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.22);position:relative}
.slider i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#FFE7C7,#FFB27A);transition:width .5s var(--ease)}
.slider b{position:absolute;top:50%;transform:translate(-50%,-50%);background:#fff;color:#1D1D1F;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;transition:left .5s var(--ease)}
.gcard h2{font-size:31px;font-weight:600;letter-spacing:-.035em;line-height:1.08;margin:0 0 8px;color:#FFF3D9}
.gsub{color:rgba(255,255,255,.72);font-size:15px;margin:0 0 22px}
.gopt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:15px 16px;margin:0 0 9px;color:#fff;font-size:15px;transition:background .25s,transform .2s}
.gopt:active{transform:scale(.98)}
.gopt .em{font-size:20px;width:26px;text-align:center}
.gopt .ck{margin-left:auto;opacity:0;transition:opacity .2s}
.gopt[aria-pressed="true"]{background:rgba(18,12,10,.72);border-color:rgba(255,255,255,.08)}
.gopt[aria-pressed="true"] .ck{opacity:1}
.gchips{display:flex;flex-wrap:wrap;gap:8px}
.gchip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:9px 13px;font-size:14px;transition:.2s}
.gchip[aria-pressed="true"]{background:#fff;color:#1D1D1F}
.ginp,.gta{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:15px 16px;color:#fff;font-size:16px}
.gta{min-height:120px;resize:vertical}
.ginp::placeholder,.gta::placeholder{color:rgba(255,255,255,.5)}
.ginp:focus,.gta:focus{outline:none;border-color:rgba(255,255,255,.5)}
.gbtn{width:100%;margin-top:22px;background:#fff;color:#1D1D1F;border:0;border-radius:20px;padding:17px;font-weight:600;font-size:16px;transition:transform .2s,opacity .2s}
.gbtn:active{transform:scale(.98)}
.gbtn:disabled{opacity:.45}
.gnote{color:rgba(255,255,255,.65);font-size:12.5px;text-align:center;margin-top:12px}
.glink{background:none;border:0;color:rgba(255,255,255,.85);width:100%;padding:12px;font-size:14px;text-decoration:underline}
.gfeat{list-style:none;padding:0;margin:0}
.gfeat li{padding:10px 0;border-top:1px solid rgba(255,255,255,.12);display:flex;gap:10px;font-size:14.5px}

/* ---------- Hoy ---------- */
.states{display:flex;gap:8px;flex-wrap:wrap}
.state{border:0;background:var(--card);box-shadow:var(--sh);border-radius:999px;padding:10px 16px;font-size:14px;font-weight:500;color:var(--ink2);transition:.25s var(--ease)}
.state[aria-pressed="true"]{background:var(--black);color:var(--onblack)}
.hrow{display:flex;gap:10px;flex-wrap:wrap}
.hbtn{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;padding:4px;width:80px;font-size:12px;color:var(--ink2);font-weight:500;text-align:center;line-height:1.2}
.hbtn .c{width:60px;height:60px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:25px;position:relative;transition:transform .35s var(--spring),background .3s,box-shadow .3s}
.hbtn[aria-pressed="true"] .c{background:linear-gradient(135deg,var(--or1),var(--or2));box-shadow:0 12px 24px -10px rgba(238,90,28,.6)}
.hbtn[aria-pressed="true"] .c::after{content:"✓";position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--black);color:var(--onblack);font-size:11px;display:grid;place-items:center;font-weight:700;border:2px solid var(--card)}
.hbtn:active .c{transform:scale(.88)}
.pop .c,.pop.hcheck,.pop.dot{animation:pop .5s var(--spring)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.evid{list-style:none;padding:0;margin:14px 0 0}
.evid li{display:flex;gap:10px;padding:7px 0;font-size:15px;border-top:1px solid var(--line)}
.evid li:first-child{border-top:0}

/* ---------- tareas ---------- */
.trow{display:flex;align-items:center;gap:14px;padding:14px 4px;border-top:1px solid var(--line);transition:opacity .4s var(--ease),transform .4s var(--ease)}
.trow:first-child{border-top:0}
.tcb{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink3);background:transparent;padding:0;display:grid;place-items:center;transition:background .25s,border-color .25s,transform .3s var(--spring)}
.tcb.p3{border-color:var(--or3)}.tcb.p2{border-color:var(--or1)}
.tcb[aria-pressed="true"]{background:var(--or2);border-color:var(--or2)}
.tcb[aria-pressed="true"]::after{content:"";width:9px;height:5px;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
.trow .tt{flex:1;min-width:0}
.trow .tt b{display:block;font-weight:500;font-size:16px;letter-spacing:-.015em}
.trow .tt small{font-size:12.5px;color:var(--ink3)}
.trow.done .tt b{color:var(--ink3);text-decoration:line-through}
.trow.leaving{opacity:0;transform:translateX(14px)}
.trow .acts{display:flex;gap:2px;opacity:0;transition:opacity .2s}
.trow:hover .acts,.trow:focus-within .acts{opacity:1}
.pri{color:var(--or3);font-weight:700;font-size:13px}
.star{color:var(--or2);font-size:14px}
.qadd{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:16px;padding:6px 6px 6px 16px}
.qadd input{flex:1;border:0;background:none;padding:8px 0;font-size:16px;min-width:0}
.qadd input:focus{outline:none}
.prio{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.prio:first-of-type{border-top:0}
.prio .n{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:600;font-size:14px;flex:none}

/* ---------- hábitos ---------- */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.hcard{padding:24px}
.hcard.isdone{background:linear-gradient(160deg,var(--peach),var(--card))}
.hcard .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px}
.hcard .em{font-size:28px;line-height:1}
.hcheck{width:52px;height:52px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;flex:none;font-size:18px;color:var(--ink3);transition:background .3s,color .3s,box-shadow .3s}
.hcheck[aria-pressed="true"]{background:linear-gradient(135deg,var(--or1),var(--or2));color:#fff;box-shadow:0 12px 24px -10px rgba(238,90,28,.6)}
.hstats{display:flex;gap:18px}
.hstats b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em}
.hstats small{font-size:11.5px;color:var(--ink3)}
.mini28{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:16px}
.mini28 i{aspect-ratio:1;border-radius:3px;background:var(--line)}
.mini28 i.on{background:var(--or2)}
.week{display:grid;grid-template-columns:minmax(170px,2fr) repeat(7,1fr) 60px;align-items:center;gap:6px}
.week .hdr{font-size:12px;font-weight:600;color:var(--ink3);text-align:center;padding-bottom:6px}
.week .hdr.today{color:var(--or3)}
.week .nm{font-size:15px;font-weight:500;display:flex;align-items:center;gap:10px;min-width:0;padding:8px 0}
.week .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{justify-self:center;width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);padding:0;display:grid;place-items:center;transition:background .3s,transform .3s var(--spring)}
.dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink3);opacity:.5}
.dot[aria-pressed="true"]{background:linear-gradient(135deg,var(--or1),var(--or2))}
.dot[aria-pressed="true"]::after{width:9px;height:5px;border-radius:0;background:none;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px);opacity:1}
.dot.today{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--or1)}
.dot:disabled{opacity:.35;cursor:default}
.dot:not(:disabled):active{transform:scale(.85)}
.week .pc{font-size:13px;font-weight:600;text-align:right}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat .h{aspect-ratio:1;border-radius:9px;background:var(--line);display:grid;place-items:center;font-size:11px;color:var(--ink3);font-weight:500}
.heat .h.f{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.heat .h.today{box-shadow:0 0 0 2px var(--or1)}
.heat .lb{font-size:11px;color:var(--ink3);text-align:center;font-weight:600}

/* ---------- listas ---------- */
.item{display:flex;align-items:center;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .e{font-size:24px;width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;flex:none}
.item .tt{flex:1;min-width:0}
.item .tt b{display:block;font-weight:600;font-size:16px;letter-spacing:-.015em}
.item .tt small{color:var(--ink3);font-size:13px}
.daysel{display:flex;gap:6px;flex-wrap:wrap}
.daysel button{width:38px;height:38px;border-radius:50%;border:0;background:var(--soft);font-size:12.5px;font-weight:600;color:var(--ink2)}
.daysel button[aria-pressed="true"]{background:var(--black);color:var(--onblack)}
.wk7{display:flex;gap:8px}
.wk7 div{flex:1;text-align:center}
.wk7 i{display:block;aspect-ratio:1;max-width:40px;margin:0 auto 6px;border-radius:50%;background:var(--soft)}
.wk7 i.on{background:linear-gradient(135deg,var(--or1),var(--or2))}
.wk7 i.today{box-shadow:0 0 0 2px var(--or1)}
.wk7 small{font-size:11.5px;color:var(--ink3);font-weight:600}
.donut{transform:rotate(-90deg)}
.legend{display:flex;flex-direction:column;gap:8px}
.legend div{display:flex;align-items:center;gap:10px;font-size:14px}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.legend span{flex:1}

/* ---------- progreso / muro ---------- */
.path{display:flex;align-items:flex-start;justify-content:space-between;position:relative;margin:10px 0 6px;min-width:520px}
.path::before{content:"";position:absolute;left:26px;right:26px;top:26px;height:2px;background:var(--line)}
.path .fw{position:absolute;left:26px;right:26px;top:26px;height:2px}
.path .fill{position:absolute;left:0;top:0;height:2px;background:linear-gradient(90deg,var(--or1),var(--or2));transition:width 1.2s var(--ease)}
.lvn{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;width:52px;text-align:center}
.lvn i{width:52px;height:52px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;font-style:normal;font-size:21px;filter:grayscale(1);opacity:.5;transition:.4s}
.lvn.on i{filter:none;opacity:1;box-shadow:inset 0 0 0 1.5px var(--or1)}
.lvn.cur i{background:linear-gradient(135deg,var(--or1),var(--or2));box-shadow:0 10px 24px -8px rgba(238,90,28,.6)}
.lvn small{font-size:12px;font-weight:500;color:var(--ink2)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.ach div{background:var(--soft);border-radius:22px;padding:20px;text-align:center}
.ach .e{font-size:30px;display:block;margin-bottom:8px;filter:grayscale(1);opacity:.4}
.ach div.on{background:var(--card);box-shadow:var(--sh)}
.ach div.on .e{filter:none;opacity:1}
.ach b{display:block;font-size:14px;font-weight:600}
.ach small{font-size:12px;color:var(--ink3)}
.timeline{position:relative;padding-left:34px}
.timeline::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl{position:relative;padding:14px 0}
.tl .dotl{position:absolute;left:-34px;top:14px;width:24px;height:24px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;font-size:12px}
.tl b{display:block;font-weight:500;font-size:16px;letter-spacing:-.015em}
.tl small{color:var(--ink3);font-size:13px}
.tlm{font-size:13px;font-weight:600;color:var(--ink3);margin:24px 0 4px}

/* ---------- explora ---------- */
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.area{display:flex;flex-direction:column;gap:24px;padding:22px;border-radius:26px;background:var(--card);box-shadow:var(--sh);min-height:156px;transition:transform .3s var(--ease)}
.area:hover{transform:translateY(-3px)}
.area .e{font-size:28px}
.area b{font-weight:600;font-size:16px;letter-spacing:-.02em;display:block}
.area small{color:var(--ink3);font-size:13px}
.les{display:flex;align-items:center;gap:16px;width:100%;border:0;background:none;text-align:left;padding:18px 0;border-top:1px solid var(--line)}
.les:first-child{border-top:0}
.les .n{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:600;flex:none}
.les .n.on{background:linear-gradient(135deg,var(--or1),var(--or2));color:#fff}
.les b{display:block;font-weight:600;font-size:16.5px;letter-spacing:-.02em}
.les small{color:var(--ink3);font-size:13px}
.reto{display:flex;flex-direction:column;justify-content:space-between;gap:20px;min-height:230px}
.reto .e{font-size:30px}

/* ---------- elevado ---------- */
.pat{border-radius:26px;padding:28px;background:var(--card);box-shadow:var(--sh)}
.pat .k{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink3);margin:0 0 6px}
.pat p{margin:0 0 18px;font-size:18px;letter-spacing:-.02em;line-height:1.4}
.pat p.q{font-size:22px;font-weight:600;letter-spacing:-.03em}
.chat{display:flex;flex-direction:column;gap:14px;max-height:520px;overflow:auto;padding:4px}
.msg{max-width:84%;padding:13px 17px;border-radius:22px;font-size:16px;line-height:1.5;white-space:pre-wrap;animation:rise .35s var(--ease)}
.msg.u{align-self:flex-end;background:var(--black);color:var(--onblack);border-bottom-right-radius:8px}
.msg.a{align-self:flex-start;background:var(--soft);border-bottom-left-radius:8px}
.chatin{display:flex;gap:10px;align-items:flex-end;background:var(--soft);border-radius:22px;padding:8px 8px 8px 18px;margin-top:16px}
.chatin textarea{flex:1;border:0;background:none;resize:none;padding:8px 0;font-size:16px;max-height:140px;min-height:24px}
.chatin textarea:focus{outline:none}
.steps4{display:flex;gap:8px;margin-bottom:26px}
.steps4 span{flex:1;font-size:12px;font-weight:600;color:var(--ink3);padding-top:10px;border-top:2px solid var(--line);letter-spacing:.04em}
.steps4 span.on{color:var(--or3);border-color:var(--or2)}
.sombra-t{border:0;text-align:left;background:var(--card);box-shadow:var(--sh);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;min-height:118px;transition:transform .3s var(--ease)}
.sombra-t:hover{transform:translateY(-2px)}
.sombra-t .e{font-size:24px}
.sombra-t b{font-weight:600;font-size:15px;letter-spacing:-.015em}
.cols4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.colk{background:var(--soft);border-radius:22px;padding:18px;min-height:180px}
.colk h4{margin:0 0 10px;font-size:15px;font-weight:600}
.colk li{font-size:14.5px;padding:6px 0;border-top:1px solid var(--line);list-style:none}
.colk ul{padding:0;margin:0}
.slide{display:grid;grid-template-columns:150px 1fr 34px;align-items:center;gap:14px;padding:8px 0}
.slide label{font-size:15px;font-weight:500}
.slide output{font-size:14px;font-weight:600;text-align:right}
input[type=range]{width:100%;accent-color:#FF7A2F}
.lockv{text-align:center;padding:70px 30px}
.lockv .orb{width:110px;height:110px;margin:0 auto 26px}
.crisis{background:linear-gradient(160deg,var(--lilac),var(--card));border-radius:24px;padding:24px;margin:16px 0}
.disclaimer{font-size:13px;color:var(--ink3);line-height:1.5}

/* ---------- formularios ---------- */
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin-bottom:6px}
.inp,.sel,.ta{width:100%;background:var(--soft);border:1px solid transparent;border-radius:14px;padding:12px 14px;font-size:16px;transition:border-color .2s,background .2s}
.ta{resize:vertical;min-height:100px;line-height:1.5}
.inp:focus,.sel:focus,.ta:focus{outline:none;border-color:var(--or1);background:var(--card)}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:42px;height:42px;border-radius:12px;border:0;background:var(--soft);font-size:20px}
.emojis button[aria-pressed="true"]{background:var(--peach);box-shadow:inset 0 0 0 1.5px var(--or1)}
.moods{display:flex;gap:8px}
.moods button{flex:1;border:0;background:var(--soft);border-radius:16px;padding:12px 0;font-size:26px;transition:.25s var(--spring)}
.moods button[aria-pressed="true"]{background:var(--peach);transform:scale(1.06)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.toggle:first-child{border-top:0}
.toggle input{appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .25s;cursor:pointer;flex:none;margin:0}
.toggle input::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .3s var(--spring)}
.toggle input:checked{background:var(--or2)}
.toggle input:checked::after{transform:translateX(18px)}
.entry{padding:18px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry p{margin:6px 0 0;white-space:pre-wrap;font-size:16px}
.empty{text-align:center;color:var(--ink3);padding:36px 10px;font-size:15px}
.empty .e{font-size:34px;display:block;margin-bottom:10px}
.goal{border-left:2px solid var(--line);padding:4px 0 4px 18px;margin:12px 0}
.goal.l1{border-color:var(--or2)}
.goal .gh{display:flex;align-items:center;gap:10px}
.goal .gh b{flex:1;font-weight:600;font-size:16px;letter-spacing:-.015em}
.goal.done>.gh b{text-decoration:line-through;color:var(--ink3)}
.goal.paused>.gh b{color:var(--ink3)}
.gtag{font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase}

/* ---------- capas ---------- */
.ov{position:fixed;inset:0;z-index:200;background:rgba(10,8,8,.32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s ease both}
.sheet{background:var(--card);width:100%;max-width:540px;max-height:92vh;overflow:auto;border-radius:30px 30px 0 0;padding:28px 24px calc(26px + env(safe-area-inset-bottom,0px));animation:up .4s var(--ease) both}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (min-width:720px){.ov{align-items:center;padding:20px}.sheet{border-radius:30px}}
.sheet h2{font-size:26px;font-weight:600;letter-spacing:-.03em;margin:0 0 6px}
.lvup{text-align:center;padding:44px 28px}
.lvup .orb{width:140px;height:140px;margin:0 auto 26px;animation:grow .9s var(--spring) both,breathe 6s 1s ease-in-out infinite}
@keyframes grow{from{transform:scale(.3);opacity:0}}
.fullsun{position:fixed;inset:0;z-index:180}
.fullsun .gcard{max-width:520px}
.reader .gcard{min-height:min(640px,86vh);display:flex;flex-direction:column}
.reader .rb{flex:1;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.reader .rb .k{color:#FFD9B0;font-size:13.5px;font-weight:600;margin:0 0 12px}
.reader .rb h2{font-size:34px}
.reader .rb p{font-size:20px;line-height:1.5;margin:0;color:#fff;letter-spacing:-.015em}
.reader textarea{width:100%;margin-top:16px;min-height:120px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:14px;color:#fff;resize:vertical}
.reader textarea::placeholder{color:rgba(255,255,255,.5)}
.focusbig{font-size:76px;font-weight:600;letter-spacing:-.05em;color:#fff}
.fly{position:fixed;z-index:300;pointer-events:none;background:var(--black);color:var(--onblack);font-size:13px;font-weight:600;border-radius:999px;padding:7px 13px;white-space:nowrap;transform:translate(-50%,0);animation:fly 1.3s var(--ease) forwards;box-shadow:0 12px 24px -10px rgba(0,0,0,.4)}
.fly em{font-style:normal;color:var(--or1);margin-left:6px}
@keyframes fly{0%{opacity:0;transform:translate(-50%,6px) scale(.9)}15%{opacity:1;transform:translate(-50%,-6px) scale(1)}75%{opacity:1;transform:translate(-50%,-26px)}100%{opacity:0;transform:translate(-50%,-38px)}}
.toast{position:fixed;left:50%;top:calc(116px + env(safe-area-inset-top,0px));z-index:320;transform:translate(-50%,-24px);opacity:0;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);border-radius:999px;padding:11px 20px;font-size:14.5px;font-weight:500;transition:transform .45s var(--spring),opacity .3s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0);opacity:1}
.thinking{display:inline-flex;gap:5px}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--ink3);animation:th 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes th{0%,80%,100%{opacity:.3;transform:none}40%{opacity:1;transform:translateY(-3px)}}

@media (max-width:1060px){.glinks{gap:18px}.s3{grid-column:span 6}.s4,.s5{grid-column:span 6}.s7,.s8{grid-column:span 12}.mods,.pillars{grid-template-columns:1fr 1fr}.foot .cols{grid-template-columns:repeat(3,1fr)}.cols4{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
 body{font-size:16px}
 .glinks,.chip-lv{display:none}
 .menu-btn{display:grid}
 .gnav .wrap{gap:10px;justify-content:space-between}
 .lnav .ttl{font-size:17px}
 .phead{padding:38px 0 24px}
 .s3,.s4,.s5,.s6,.s7,.s8{grid-column:span 12}
 .g2,.g3{grid-template-columns:1fr}
 .g4{grid-template-columns:1fr 1fr}
 .tile{padding:22px;border-radius:24px}
 .scene,.plans{grid-template-columns:1fr}
 .datecard{min-height:380px!important}
 .mods,.pillars{grid-template-columns:1fr}
 .hero{padding:56px 0 20px}
 .foot .cols{grid-template-columns:1fr 1fr}
 .week{grid-template-columns:minmax(100px,1.3fr) repeat(7,1fr) 40px;gap:3px}
 .dot{width:30px;height:30px}
 .trow .acts{opacity:1}
 .keep{grid-template-columns:repeat(3,1fr)!important}
 .lvorb{width:92px!important;height:92px!important}
 .cols4{grid-template-columns:1fr}
 .slide{grid-template-columns:110px 1fr 30px}
}

.aerr{min-height:0;margin:0;font-size:13.5px;color:#D93A2B;line-height:1.4}
.aerr.on{margin:4px 0 12px}
.aerr.good{color:#2F8F57}
.abtn{display:block;width:100%;text-align:center;border:0;background:var(--black);color:var(--onblack);border-radius:14px;padding:15px;font-size:16px;font-weight:600;margin-top:6px;transition:transform .15s,opacity .2s}
.abtn:active{transform:scale(.98)}.abtn:disabled{opacity:.55}
.abtn.sec{background:var(--soft);color:var(--ink);margin-top:10px}
.abtn.out{background:transparent;color:#D93A2B;box-shadow:inset 0 0 0 1px var(--line);margin-top:16px}
.anote{font-size:12.5px;color:var(--ink3);text-align:center;margin:14px 0 0}
.anote a{text-decoration:underline}
.asent{text-align:center;padding:10px 0}
.asent .ok{font-size:42px}
.asent h3{font-size:22px;font-weight:600;letter-spacing:-.03em;margin:8px 0 8px}
.asent p{color:var(--ink2);margin:0 0 18px}
/* versión oscura dentro de la bienvenida y del plan */
.auth.dark .authseg{background:rgba(255,255,255,.12)}
.auth.dark .authseg button{color:rgba(255,255,255,.75)}
.auth.dark .authseg button[aria-selected="true"]{background:#fff;color:#1D1D1F}
.auth.dark .afld>span:first-child{color:rgba(255,255,255,.8)}
.auth.dark .afld input{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:#fff}
.auth.dark .afld input::placeholder{color:rgba(255,255,255,.5)}
.auth.dark .eye{color:#fff}
.auth.dark .alink{color:#FFE2C2}.auth.dark .alink.c{color:rgba(255,255,255,.8)}
.auth.dark .aerr{color:#FFD0C7}
.auth.dark .abtn{background:#fff;color:#1D1D1F}
.auth.dark .gbtn-g{background:#fff;color:#1D1D1F;border:0}
.auth.dark .aor{color:rgba(255,255,255,.7)}.auth.dark .aor::before,.auth.dark .aor::after{background:rgba(255,255,255,.25)}
.auth.dark .anote{color:rgba(255,255,255,.7)}
.auth.dark .asent p{color:rgba(255,255,255,.8)}
@media (max-width:900px){
 .authpage{grid-template-columns:1fr}
 .authside{display:none}
 .authmain{justify-content:flex-start;padding:22px 22px 40px}
 .authmain .logo.m{display:block;align-self:flex-start;margin-bottom:34px;font-size:15px}
 .authmain::before{content:"";display:block;width:100%;max-width:400px;height:0}
 .authcard h1{font-size:32px}
}
/* menú de cuenta */
button.av{border:0;padding:0}
.acct-h{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.acct-h>div:not(.ess){flex:1;min-width:0}
.acct-h b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em}
.acct-h small{color:var(--ink3);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-l{display:flex;flex-direction:column;background:var(--soft);border-radius:18px;overflow:hidden}
.acct-l a,.acct-l button{display:flex;align-items:center;gap:14px;padding:15px 16px;border:0;background:none;font-size:15.5px;text-align:left;border-top:1px solid var(--line);color:var(--ink)}
.acct-l>*:first-child{border-top:0}
.acct-l span{flex:1}
.acct-l a:hover,.acct-l button:hover{background:var(--line)}
@media (min-width:720px){.sheet.acct{max-width:400px}}

.disp{font-weight:600;letter-spacing:-.025em}

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gOr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB27A"/><stop offset="1" stop-color="#EE5A1C"/></linearGradient></defs></svg>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const L=(t,c,q,a)=>({t,c,q,a});
const AREAS=[
{id:"ie",n:"Inteligencia emocional",d:"Entiende lo que sientes y úsalo a tu favor.",L:[
 L("Tus emociones son información, no órdenes",["Sentir rabia, miedo o tristeza no te hace débil. Te hace humano. El problema nunca es la emoción: es lo que haces cuando la dejas manejar el volante.","Cada emoción trae un mensaje. La rabia dice “algo cruzó un límite”. El miedo dice “esto me importa”. La tristeza dice “perdí algo valioso”.","El papel de víctima dice: “me hicieron sentir así”. Quien se hace responsable dice: “esto siento, ¿qué me está diciendo?”","No eliges lo que sientes primero. Sí eliges lo que haces después. Ahí empieza tu poder."],"¿Qué emoción se ha repetido más en tu semana y qué crees que intenta decirte?","Hoy, cuando sientas algo fuerte, nómbralo en voz baja: “Esto es ___”. Solo eso."),
 L("Nombra para domar",["Decir “estoy mal” es como decirle al médico “me duele algo”. No ayuda a nadie, ni siquiera a ti.","Cuando pones un nombre preciso a lo que sientes —frustración, decepción, vergüenza, celos— tu mente deja de luchar contra una nube y empieza a trabajar con algo concreto.","Nombrar no es quejarse. Quejarse busca a un culpable. Nombrar busca entender.","Mientras más palabras tienes para tus emociones, más opciones tienes para responder."],"Piensa en la última vez que dijiste “estoy mal”. ¿Qué sentías exactamente?","Escribe tres emociones que sentiste hoy, con la palabra más precisa que encuentres."),
 L("La pausa que cambia todo",["Entre lo que te pasa y lo que haces hay un espacio. Pequeño, pero existe.","Quien vive en el papel de víctima cree que ese espacio no existe: “me provocó”, “no pude evitarlo”.","Respira hondo dos veces antes de responder. Ese segundo de aire es tuyo, y nadie te lo puede quitar.","En la pausa hazte una sola pregunta: ¿qué haría la versión de mí que quiero ser?"],"¿En qué situación reaccionas siempre igual y luego te arrepientes?","La próxima vez que algo te active, respira dos veces antes de hablar o escribir.")]},
{id:"co",n:"Conciencia",d:"Date cuenta de lo que haces sin darte cuenta.",L:[
 L("Sal del piloto automático",["Gran parte de tu día pasa en automático: las mismas reacciones, los mismos pensamientos, los mismos resultados.","No puedes cambiar lo que no ves. Por eso todo cambio empieza con darte cuenta.","Darte cuenta no es juzgarte. Es observarte con curiosidad, como si estudiaras a alguien que quieres entender.","Hoy no tienes que arreglar nada. Solo mirar."],"¿Qué haces todos los días sin pensarlo que no te está ayudando?","Pon tres alarmas hoy. Cuando suenen, pregúntate: ¿qué estoy haciendo y por qué?"),
 L("Hechos contra historias",["Un hecho: “no me respondió el mensaje”. Una historia: “no le importo”.","Tu mente rellena los vacíos con historias, y casi siempre las escribe en tu contra.","El papel de víctima se alimenta de historias que nadie comprobó.","Antes de sufrir por algo, pregúntate: ¿esto lo sé o lo estoy suponiendo?"],"¿Qué historia te estás contando ahora mismo que podría no ser verdad?","Escribe una situación que te preocupa en dos columnas: lo que sabes y lo que supones."),
 L("Tus patrones te están hablando",["Si la misma situación se repite con distintas personas, el factor común merece atención.","No para culparte. Para recuperar tu poder: si eres parte del patrón, también puedes ser parte de la salida.","Los patrones no son tu destino. Son tu mapa.","Lo que repites sin mirar se vuelve tu vida. Lo que miras, puedes cambiarlo."],"¿Qué situación se ha repetido varias veces en tu vida?","Escribe qué hiciste tú, cada vez, en esa situación. Sin juzgarte.")]},
{id:"re",n:"Regulación",d:"Calma tu cuerpo para que tu mente pueda decidir.",L:[
 L("Primero el cuerpo, después la mente",["Cuando estás en modo alarma, tu cuerpo cree que hay un peligro y tu mente pierde claridad.","Por eso no sirve decirte “cálmate”. Hay que hablarle al cuerpo en su idioma: respiración, movimiento, pausa.","Prueba exhalar más largo de lo que inhalas. Tu sistema nervioso lo entiende como una señal de seguridad.","Cuando el cuerpo baja la guardia, vuelves a tener opciones."],"¿Dónde sientes el estrés en tu cuerpo?","Haz cinco respiraciones con la exhalación más larga que la inhalación."),
 L("Reaccionar o responder",["Reaccionar es rápido, automático y casi siempre te deja peor. Responder toma un poco más, pero te deja en paz contigo.","Nadie te “hace” explotar. Hay algo que te activa, y hay algo que tú haces después.","Hacerte responsable no es reprimirte. Es elegir cómo y cuándo expresar lo que sientes.","Si no puedes responder bien ahora, está permitido decir: “necesito un momento y luego hablamos”."],"¿Con quién reaccionas más rápido y por qué crees que pasa?","Prepara tu frase de pausa y úsala la próxima vez que la necesites."),
 L("Cuando todo se te viene encima",["Cuando sientes que todo es demasiado, la mente mezcla todo en una sola montaña.","Separa la montaña en piedras: escribe todo lo que te pesa, una cosa por línea.","Marca lo que depende de ti. Lo demás, por hoy, suéltalo.","De lo que depende de ti, elige una sola cosa pequeña y hazla. El movimiento calma."],"¿Qué te está pesando más en este momento?","Haz tu lista, marca lo que depende de ti y termina una sola cosa hoy.")]},
{id:"ex",n:"Expresión",d:"Di lo que piensas y necesitas, con respeto.",L:[
 L("Pide lo que necesitas",["Esperar que los demás adivinen lo que necesitas y molestarte cuando no lo hacen es una forma silenciosa de victimismo.","Nadie puede leer tu mente. Tu responsabilidad es decirlo.","Usa esta estructura: “Cuando pasa ___, me siento ___. Necesito ___. ¿Podemos ___?”","Hablar de ti en lugar de atacar al otro abre la conversación en vez de cerrarla."],"¿Qué necesitas de alguien que todavía no le has dicho?","Escribe tu mensaje con la estructura y decide cuándo lo vas a decir."),
 L("El poder de un no",["Cada vez que dices sí cuando quieres decir no, te dices no a ti.","Luego aparece el resentimiento: “siempre se aprovechan”. Pero también tú lo permitiste.","Un no claro y amable es más respetuoso que un sí lleno de rabia.","No necesitas justificarte demasiado. “Esta vez no puedo” es una frase completa."],"¿A qué le estás diciendo que sí cuando quieres decir que no?","Di un no pequeño hoy, sin excusas largas."),
 L("Tu voz también ocupa espacio",["Callar para no incomodar parece paz, pero muchas veces es abandono propio.","Tu opinión no tiene que ser perfecta para ser válida.","Empieza en lugares seguros: una reunión, una conversación con amistades, una publicación.","Cada vez que hablas, entrenas la confianza de que lo que piensas importa."],"¿Dónde te quedas en silencio aunque tengas algo que decir?","Comparte una opinión hoy en un espacio donde normalmente callarías.")]},
{id:"mo",n:"Motivación",d:"Muévete aunque no tengas ganas.",L:[
 L("Las ganas llegan después",["Esperar a tener ganas es como esperar a tener hambre para comprar comida.","La motivación no siempre es la causa de la acción. Muchas veces es la consecuencia.","Empieza con dos minutos. Abre el documento, ponte los tenis, escribe una línea.","Quien empieza sin ganas termina con impulso. Quien espera las ganas, sigue esperando."],"¿Qué estás esperando hacer “cuando tengas ganas”?","Haz dos minutos de esa tarea hoy. Solo dos."),
 L("Un porqué que sea tuyo",["Las metas que eliges para impresionar a otros se apagan rápido.","Un porqué de verdad suena a: “quiero esto porque me importa ___”.","Cuando tu porqué está claro, los obstáculos son problemas a resolver, no razones para rendirte.","Escríbelo y míralo cuando quieras abandonar."],"¿Por qué quieres de verdad cambiar algo en tu vida?","Escribe tu porqué en una frase y ponlo donde lo veas cada día."),
 L("Victorias pequeñas, impulso real",["Las metas enormes paralizan. Las pequeñas se cumplen.","Cada vez que cumples algo pequeño, tu cerebro aprende: “puedo”.","Divide tu meta hasta que el primer paso sea tan pequeño que parezca ridículo.","Celebra cada paso. No es infantil: es entrenamiento."],"¿Cuál es tu meta grande y cuál sería el primer paso ridículamente pequeño?","Haz ese primer paso hoy y anótalo como victoria.")]},
{id:"nu",n:"Nutrición",d:"Una relación con la comida basada en atención, no en culpa.",L:[
 L("Come con atención",["Comer frente a la pantalla, de pie o a toda prisa desconecta tu cuerpo de lo que está recibiendo.","Comer con atención no es una dieta. Es estar presente: notar sabores, texturas y cómo te sientes.","Tu cuerpo te da señales. Escucharlas es una forma de respeto propio.","Empieza con una comida al día sin pantallas."],"¿Cómo comes normalmente: con prisa, con distracciones o con presencia?","Haz una comida hoy sin pantallas y observa qué notas."),
 L("¿Qué tipo de hambre es esta?",["A veces comes porque tu cuerpo lo necesita. Otras veces, por aburrimiento, cansancio o emoción.","No hay culpa en ninguna de las dos. Hay información.","Antes de comer fuera de tu rutina, pregúntate con cariño: ¿qué necesito realmente ahora?","Si es descanso, compañía o calma, la comida puede acompañar, pero no resolver."],"¿En qué momentos del día comes por algo que no es hambre?","Hoy, antes de picar algo, haz una pausa amable y pregúntate qué necesitas."),
 L("Tu plato, tu decisión",["Nadie más decide lo que entra en tu cuerpo. Ni la publicidad, ni las prisas, ni las costumbres.","Hacerte responsable aquí no es prohibirte cosas. Es planear un poco para no depender de lo que haya.","Tener agua a mano, fruta visible o una comida preparada son decisiones pequeñas con mucho efecto.","Si tienes dudas sobre tu alimentación, una persona profesional de la nutrición puede guiarte según tu caso."],"¿Qué pequeña decisión haría tu alimentación más fácil esta semana?","Prepara algo hoy que tu yo de mañana te agradezca.")]},
{id:"ha",n:"Hábitos",d:"Cambios pequeños que se vuelven quien eres.",L:[
 L("Tan pequeño que no puedas fallar",["Los hábitos no fallan por falta de fuerza de voluntad. Fallan porque empiezan demasiado grandes.","Leer una página. Una flexión. Un vaso de agua al despertar.","Lo importante al principio no es cuánto, es que se repita.","Primero construyes a la persona que aparece cada día. Después aumentas."],"¿Qué hábito has intentado y abandonado varias veces?","Redúcelo a su versión de dos minutos y hazlo hoy."),
 L("Diseña tu entorno",["Tu entorno vota todos los días por ti. Si el celular está en la cama, ganará el celular.","No luches contra tu ambiente: cámbialo.","Pon a la vista lo que quieres hacer. Esconde lo que quieres dejar.","Hacerte responsable también es preparar el terreno para que tu mejor versión gane."],"¿Qué hay en tu entorno que te empuja hacia lo que no quieres?","Cambia hoy una sola cosa de lugar para facilitar un buen hábito."),
 L("Nunca falles dos veces",["Vas a fallar. Todas las personas fallan. Eso no es el problema.","El problema es el pensamiento de “ya lo arruiné, mejor lo dejo”.","Una regla simple: puedes fallar un día, nunca dos seguidos.","Volver rápido vale más que nunca caer."],"¿Qué te dices cuando fallas en algo que te propusiste?","Escribe la frase que te dirás la próxima vez que falles.")]},
{id:"ac",n:"Autoconfianza",d:"Confía en ti porque te has visto cumplir.",L:[
 L("La confianza se gana contigo",["La confianza no aparece leyendo frases bonitas. Aparece cuando te ves cumplir lo que te prometes.","Cada promesa rota contigo resta. Cada promesa cumplida suma.","Por eso empieza con promesas pequeñas que sí puedas cumplir.","Tu autoestima es la reputación que tienes contigo."],"¿Qué promesa te has hecho muchas veces sin cumplirla?","Hazte una promesa pequeña para hoy y cúmplela."),
 L("Deja de pedir permiso",["Esperar que alguien te diga “ya puedes” es dejar tu vida en manos ajenas.","Nadie va a llegar a darte la autorización. Te la das tú.","Puedes tener miedo y hacerlo igual. El valor no es la ausencia de miedo.","La confianza no siempre llega antes de actuar. Muchas veces llega después."],"¿Para qué estás esperando permiso?","Da hoy un paso hacia eso sin pedir la opinión de nadie."),
 L("Tus logros invisibles",["Tu mente recuerda cada error y olvida casi cada logro.","Superaste cosas que alguna vez creíste imposibles. Eso también eres.","Escribir tus logros no es arrogancia: es memoria justa.","No empiezas desde cero. Empiezas desde todo lo que ya has vivido."],"¿Qué has superado que hoy das por sentado?","Escribe cinco cosas que has conseguido o superado.")]},
{id:"me",n:"Mentalidad",d:"Del papel de víctima al de protagonista.",L:[
 L("De víctima a protagonista",["Lo que te pasó puede ser real e injusto. Quedarte en el papel de víctima es otra cosa: una elección que se repite cada día sin notarlo.","El papel de víctima dice: “no puedo porque…”. El de protagonista pregunta: “¿qué sí puedo hacer con lo que tengo?”","Hacerte responsable no significa que todo sea tu culpa. Significa que tu respuesta es tuya.","La culpa mira hacia atrás. La responsabilidad mira hacia adelante."],"¿En qué área de tu vida sigues esperando que alguien más cambie?","Usa “Reescribe tu historia” en Hoy con esa situación."),
 L("El poder de “todavía”",["“No sé hacerlo” cierra una puerta. “Todavía no sé hacerlo” la deja abierta.","Tu capacidad no es fija. Se entrena, como un músculo.","Cada error es un dato, no una sentencia.","Las personas que avanzan no son las que nunca fallan. Son las que aprenden más rápido."],"¿Qué crees que no eres capaz de hacer?","Reescribe esa frase agregando “todavía” y un primer paso."),
 L("Tus palabras construyen tu realidad",["“Tengo que” suena a obligación. “Elijo” suena a decisión.","“Siempre me pasa” suena a destino. “Esta vez pasó” suena a evento.","Las palabras que usas sobre tu vida le dicen a tu mente quién manda.","Cambia el lenguaje y empiezas a cambiar la postura."],"¿Qué frase dices con frecuencia que te quita poder?","Durante hoy, cambia cada “tengo que” por “elijo”.")]},
{id:"au",n:"Autocuidado",d:"Trátate como alguien que importa.",L:[
 L("Cuidarte no es egoísmo",["Nadie puede dar desde un vaso vacío.","Esperar a que otros te cuiden mientras tú te descuidas es una forma de abandono propio.","El autocuidado no siempre es un spa. A veces es dormir temprano, pedir ayuda o ir al médico.","Cuidarte es tu responsabilidad, no un premio que hay que ganarse."],"¿Qué necesitas hace tiempo y no te has dado?","Agenda hoy un momento de cuidado propio, aunque sean 15 minutos."),
 L("Límites que te protegen",["Un límite no es un muro contra los demás. Es una puerta que tú decides cuándo abrir.","Si no pones límites, otras personas los pondrán por ti.","Un límite sano suena así: “Esto sí, esto no. Si pasa esto, yo haré esto”.","Al principio incomoda. Después, libera."],"¿Dónde sientes que se están cruzando tus límites?","Escribe un límite que vas a comunicar esta semana."),
 L("Descansa sin culpa",["El descanso no es lo opuesto a la productividad. Es parte de ella.","Si solo descansas cuando colapsas, tu cuerpo decidirá por ti.","Programa pausas antes de necesitarlas.","Descansar es una forma de decir: “mi bienestar también es prioridad”."],"¿Cómo te sientes cuando descansas: en paz o con culpa?","Toma una pausa real hoy, sin pantallas, aunque sean 10 minutos.")]},
{id:"ej",n:"Ejercicio",d:"Mueve tu cuerpo para sentirte bien.",L:[
 L("Moverte por amor, no por castigo",["Si el ejercicio se siente como castigo, tu mente buscará cómo huir de él.","Muévete porque te ayuda a tener energía, dormir mejor y sentirte con más ánimo.","Caminar, bailar, estirarte o jugar también cuentan.","Elige un movimiento que disfrutes. Ese es el que vas a sostener."],"¿Qué tipo de movimiento disfrutabas antes y dejaste?","Mueve tu cuerpo 10 minutos hoy de la forma que más disfrutes."),
 L("El mínimo que sí harás",["Los planes perfectos de una hora se rompen al primer día ocupado.","Ten una versión mínima: cinco minutos, en casa, sin equipo.","Los días buenos haces más. Los difíciles haces el mínimo. Pero no desapareces.","La constancia le gana a la intensidad."],"¿Cuál sería tu versión mínima de movimiento?","Define tu mínimo y hazlo hoy."),
 L("Escucha a tu cuerpo",["Moverte con responsabilidad incluye respetar tus límites físicos.","El cansancio sano no es lo mismo que el dolor. El dolor es una señal para parar.","Si tienes alguna condición de salud, consulta a una persona profesional antes de empezar algo nuevo.","Tu cuerpo no es un proyecto a corregir. Es tu casa."],"¿Cómo le hablas a tu cuerpo cuando te ejercitas?","Al moverte hoy, agradece algo que tu cuerpo hace por ti.")]},
{id:"em",n:"Empatía",d:"Comprende a los demás sin perderte a ti.",L:[
 L("Entender no es justificar",["Comprender por qué alguien actuó como actuó no significa aprobarlo.","La empatía te saca del “me lo hizo a mí” y te muestra que cada persona carga su propia historia.","Esto te devuelve poder: dejas de tomarte todo como algo personal.","Puedes comprender y aun así poner un límite."],"¿A quién te cuesta entender ahora mismo?","Escribe tres razones posibles, que no tengan que ver contigo, de por qué actuó así."),
 L("Escucha para comprender",["La mayoría escucha para responder. Muy pocas personas escuchan para entender.","Escuchar de verdad es guardar tu argumento por un momento.","Prueba repetir lo que entendiste: “Lo que escucho es que…”.","Las personas se abren cuando se sienten escuchadas, no cuando se sienten corregidas."],"¿Con quién sueles preparar tu respuesta mientras habla?","En tu próxima conversación, resume lo que entendiste antes de opinar."),
 L("Empatía contigo",["Muchas personas son comprensivas con todos menos consigo.","Hablarte con dureza no te hace más responsable. Te hace sentir peor.","Responsabilidad y compasión van juntas: “me equivoqué, y voy a repararlo”.","Háblate como le hablarías a alguien que amas."],"¿Qué te dices cuando te equivocas?","Escribe lo que le dirías a alguien querido en tu situación y léelo para ti.")]},
{id:"ar",n:"Amor y relaciones",d:"Relaciones desde la elección, no desde la necesidad.",L:[
 L("Nadie viene a completarte",["Buscar a alguien que te salve, te haga feliz o te dé valor es poner tu vida en manos ajenas.","Las relaciones sanas suman a una vida que ya tiene sentido.","Tu felicidad no es tarea de nadie más.","Cuando te eliges, eliges mejor a quién dejas entrar."],"¿Qué esperas que otra persona te dé que podrías darte tú?","Haz hoy por ti algo que normalmente esperas de alguien más."),
 L("Lo que permites, se repite",["Las personas aprenden cómo tratarte viendo lo que aceptas.","Quejarte de un trato que sigues aceptando te mantiene en el mismo lugar.","Hacerte responsable es preguntarte: ¿qué estoy permitiendo y qué voy a hacer distinto?","Si una relación te hace daño o te da miedo, buscar apoyo profesional o de personas de confianza es un acto de valor."],"¿Qué estás permitiendo en una relación que no quieres seguir permitiendo?","Escribe qué harás diferente la próxima vez que pase."),
 L("Las conversaciones difíciles",["Evitar una conversación difícil no la elimina. Solo la pospone y la hace más grande.","Elige un buen momento y habla de lo que sientes y necesitas, no de lo que la otra persona “es”.","Ve con la intención de entender, no de ganar.","Una conversación incómoda hoy puede evitar años de distancia."],"¿Qué conversación estás evitando?","Escribe la primera frase con la que la empezarías.")]},
{id:"fi",n:"Finanzas personales",d:"Toma el control de tu dinero.",L:[
 L("Mira tus números sin miedo",["Evitar mirar tu cuenta no hace que el problema desaparezca. Solo lo vuelve más grande en tu cabeza.","Saber cuánto entra y cuánto sale es el primer acto de responsabilidad financiera.","No necesitas saber de finanzas. Necesitas mirar.","Lo que se mide, se puede mejorar."],"¿Sabes cuánto gastaste el mes pasado? ¿Qué sientes al pensarlo?","Revisa tus gastos de la última semana y anota en qué se fue tu dinero."),

function spark(vals,w=160,h=42){const pts=vals.map((v,i)=>[i*(w/(vals.length-1)),h-4-(Math.min(100,v)/100)*(h-8)]);const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d} L${w} ${h} L0 ${h}Z" fill="url(#gOr)" opacity=".12"/><path d="${d}" fill="none" stroke="url(#gOr)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3.5" fill="#EE5A1C"/></svg>`;}
function radar(scores,prev,size=360){const n=VIDA.length,cx=size/2,cy=size/2,R=size/2-58;const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100];};
 const poly=s=>VIDA.map((v,i)=>pt(i,s[v[0]]??0).map(x=>x.toFixed(1)).join(",")).join(" ");

 VIDA.forEach((v,i)=>{const [x,y]=pt(i,100);g+=`<line class="grid" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`;const [lx,ly]=pt(i,124);g+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle">${v[2]}</text>`;});
 return `<svg class="radar" viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size}px" role="img" aria-label="Brújula de vida"><defs><linearGradient id="gOrA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB27A" stop-opacity=".55"/><stop offset="1" stop-color="#EE5A1C" stop-opacity=".35"/></linearGradient></defs>${g}${prev?`<polygon class="prev" points="${poly(prev)}"/>`:""}<polygon class="shape" points="${poly(scores)}"/></svg>`;}

 tickFocus();}

  if(SESSION){await refreshPlan();await pullSync();}else if(S.plan==="elevado"){S.plan="esencial";save(true);}

  if(x.rep&&x.rep!=="no"){const base=x.due||T();let nd;if(x.rep==="diaria")nd=add(base,1);else if(x.rep==="semanal")nd=add(base,7);else{const d=pd(base);d.setMonth(d.getMonth()+1);nd=ds(d);}if(nd<=T())nd=add(T(),1);S.tasks.push({id:uid(),t:x.t,pri:x.pri,due:nd,cat:x.cat,rep:x.rep,gid:x.gid,done:false});}
  setTimeout(()=>row?.classList.add("leaving"),450);rerender(820);}
 else{x.done=false;x.doneAt=null;xp(-CONFIG.xp.tarea,"tareas");rerender();}}

 overlay(`<div class="sheet"><h2>Elige una prioridad</h2><p class="muted" style="margin:0 0 16px">¿Qué haría que hoy cuente?</p><div class="qadd" style="margin-bottom:14px"><input id="prioNew" placeholder="Escribe una nueva prioridad"><button class="btn sm" data-act="prioCrear">Agregar</button></div>${cand.length?cand.map(x=>`<button class="les" data-prio-pick="${x.id}"><span class="n">${(TCAT.find(c=>c[0]===x.cat)||["","✓"])[1]}</span><span style="flex:1"><b style="font-size:15.5px">${esc(x.t)}</b><small>${x.due?(x.due<=t?"Para hoy":fdate(x.due,{day:"numeric",month:"short"})):"Sin fecha"}</small></span><span>+</span></button>`).join(""):`<p class="tiny">No tienes otras tareas pendientes.</p>`}</div>`);}
function retoDia(id,btn){const R=RETOS.find(r=>r.id===id),st=S.retos[id];if(!st||st.done)return;const n=Object.keys(st.days).length+1;st.days[n]=T();xp(CONFIG.xp.retoDia,"otros",btn,R.e+" Día "+n);
 if([7,14,21].includes(n)&&n<R.d)wall(R.e,n+" días del reto “"+R.t+"”");
 if(n>=R.d){setTimeout(()=>overlay(`<div class="sheet"><div style="text-align:center"><p style="font-size:48px;margin:0">👑</p><h2>Completaste “${esc(R.t)}”</h2><p class="muted" style="margin:0 0 18px">Antes de cerrar: ¿qué aprendiste de ti en estos ${R.d} días?</p></div><textarea class="ta" id="retoRef" placeholder="Tu reflexión final"></textarea><div style="text-align:right;margin-top:14px"><button class="btn or" data-reto-fin="${id}">Guardar · +${CONFIG.xp.reto} XP</button></div></div>`),700);}
 rerender(500);}

/* ================= BASE DE DATOS: sincronización ================= */
const SYNC_SKIP=["plan","cloudPlan","focus","onb","chat","acct","syncAt"];
let SYNC_T=null,SYNC_BUSY=false,ACT_Q=[];
function cloudData(){const o={};Object.keys(S).forEach(k=>{if(!SYNC_SKIP.includes(k))o[k]=S[k];});if(!(S.ciclo&&S.ciclo.cloud))o.ciclo={on:false};return o;}
function logAct(tipo,detalle,n=0){if(!cloudOn())return;ACT_Q.push({tipo:String(tipo).slice(0,40),detalle:String(detalle||"").replace(/<[^>]*>/g,"").slice(0,140),xp:n|0});if(ACT_Q.length>60)ACT_Q.splice(0,ACT_Q.length-60);}
function scheduleSync(){if(!SB||!SESSION||!S.onbDone)return;clearTimeout(SYNC_T);SYNC_T=setTimeout(pushSync,1800);}
async function pushSync(){if(!SB||!SESSION||!S.onbDone||SYNC_BUSY)return;SYNC_BUSY=true;clearTimeout(SYNC_T);
 try{const {error}=await SB.from("estados").upsert({user_id:SESSION.user.id,datos:cloudData(),actualizado:new Date().toISOString()});
  if(error)console.error("estados",error);else{S.acct=SESSION.user.id;S.syncAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
  if(ACT_Q.length){const rows=ACT_Q.splice(0).map(a=>Object.assign({user_id:SESSION.user.id},a));const r=await SB.from("actividad").insert(rows);if(r.error)console.error("actividad",r.error);}
 }catch(e){console.error(e);}SYNC_BUSY=false;}
function hasProgress(o){return !!o&&o.onbDone&&((o.xp||0)>0||(o.habits||[]).some(h=>Object.keys(h.days||{}).length)||(o.tasks||[]).some(t=>t.done)||(o.diary||[]).length>0);}
function applyCloud(c){const keep={plan:S.plan,cloudPlan:S.cloudPlan,focus:S.focus,chat:S.chat||[],ciclo:S.ciclo};
 S=Object.assign(nuevo(),c,{plan:keep.plan,cloudPlan:keep.cloudPlan,focus:keep.focus,chat:keep.chat});
 if(!(c.ciclo&&c.ciclo.on)&&keep.ciclo&&keep.ciclo.on)S.ciclo=keep.ciclo;
 S.acct=SESSION.user.id;S.onbDone=true;S.edad=true;try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
async function pullSync(){if(!SB||!SESSION)return;
 const {data,error}=await SB.from("estados").select("datos,actualizado").eq("user_id",SESSION.user.id).maybeSingle();
 if(error){console.error("estados",error);return;}
 const me=SESSION.user.id;
 if(!data||!data.datos){if(S.onbDone){S.acct=me;pushSync();}return;}
 const cloud=data.datos;
 if(S.acct===me){if((cloud._t||0)>(S._t||0)){applyCloud(cloud);render();}else if((S._t||0)>(cloud._t||0))pushSync();return;}
 if(!hasProgress(S)){applyCloud(cloud);render();toast("✓ Recuperamos tu progreso");return;}
 if(!hasProgress(cloud)){S.acct=me;pushSync();return;}
 const lv=o=>{let l=0;CONFIG.umbrales.forEach((u,i)=>{if((o.xp||0)>=u)l=i;});return MARCA.niveles[l][1]+" "+MARCA.niveles[l][0];};
 overlay(`<div class="sheet"><h2>Encontramos dos progresos</h2><p class="muted" style="margin:0 0 16px">Tu cuenta ya tenía progreso guardado, y este dispositivo también. ¿Cuál quieres conservar?</p>
 <button class="letter" data-merge="cloud"><span style="font-size:26px">☁️</span><span style="flex:1"><b>El de mi cuenta</b><small>${lv(cloud)} · ${(cloud.xp||0).toLocaleString("es")} XP</small></span><span>→</span></button>
 <button class="letter" data-merge="local"><span style="font-size:26px">📱</span><span style="flex:1"><b>El de este dispositivo</b><small>${lv(S)} · ${S.xp.toLocaleString("es")} XP</small></span><span>→</span></button>
 <p class="tiny" style="margin-top:14px">El que no elijas se reemplaza.</p></div>`);

 onbAtras(){if(S.onb.step===0)location.hash=S.onbDone?"#/hoy":"#/";else{S.onb.step--;save();render();}},

 cicloGuardar(){const i=val("cyI");if(!i){toast("Elige la fecha de tu última regla");return;}const C=S.ciclo;C.on=true;C.ask=false;C.inicio=i;C.dur=+val("cyD")||28;C.regla=+val("cyR")||5;C.hist=C.hist||[];if(!C.hist.includes(i))C.hist.push(i);cerrarOv();save();render();toast("🌙 Tu ciclo está activo");logAct("ciclo","activado",0);},
 cicloHoy(){const C=S.ciclo,t=T();if(C.inicio&&C.inicio!==t){const d=Math.round((pd(t)-pd(C.inicio))/864e5);C.hist=(C.hist||[]).concat(t).slice(-12);if(d>=21&&d<=45){const ds_=C.hist.slice().sort();const gaps=[];for(let i=1;i<ds_.length;i++){const g=Math.round((pd(ds_[i])-pd(ds_[i-1]))/864e5);if(g>=21&&g<=45)gaps.push(g);}if(gaps.length)C.dur=Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length);}}C.inicio=t;C.on=true;save();render();toast("🌑 Anotado. Hoy vale ir más lento.");},
 cartaForm(){cartaForm();},
 cartaSellar(b){const v=val("cT");if(v.length<10){toast("Escribe un poco más antes de sellarla");return;}const d=+(picked("#cA")||90);const abre=add(T(),d);lazy("cartas",[]).push({id:uid(),txt:v,at:Date.now(),abre,leida:false});cerrarOv();xp(CONFIG.xp.carta,"reflexion",null,"✉️ Carta sellada");wall("✉️","Sellaste una carta que se abre el "+fdate(abre,{day:"numeric",month:"long",year:"numeric"}));logAct("carta","sellada "+d+" días",CONFIG.xp.carta);rerender();if(CRISIS.test(v))setTimeout(()=>overlay(`<div class="sheet">${crisisHtml()}<div style="text-align:right"><button class="btn" data-act="cerrar">Entendido</button></div></div>`),600);},
 entrarGoogle(){entrarGoogle();},
 async cerrarSesion(){await pushSync();if(SB)await SB.auth.signOut();S=nuevo();try{localStorage.removeItem(LS);}catch(e){}location.hash="#/";render();toast("Cerraste sesión");},
 borrar(){ask("¿Borrar todos tus datos"+(SESSION?" de este dispositivo y de tu cuenta":" de este navegador")+"?",async()=>{if(SB&&SESSION){try{await SB.from("actividad").delete().eq("user_id",SESSION.user.id);await SB.from("estados").delete().eq("user_id",SESSION.user.id);await SB.auth.signOut();}catch(e){console.error(e);}}S=nuevo();try{localStorage.removeItem(LS);}catch(e){}location.hash="#/";render();toast("Tus datos se borraron");},"Borrar todo");}};
document.addEventListener("click",e=>{const b=e.target.closest("button,a");if(!b)return;const d=b.dataset;
 if(d.mood5){const M=MOOD5.find(x=>x.k===d.mood5);S.moods[T()]={m:M.k,at:Date.now()};if(!S.dayState[T()])S.dayState[T()]=M.st;xp(CONFIG.xp.checkin,"reflexion",b,M.e+" Check-in");logAct("checkin",M.k,CONFIG.xp.checkin);rerender(380);if(M.k==="ansiosa")setTimeout(()=>toast("🌬️ Cuando quieras, respira conmigo"),900);return;}
 if(d.mact){const a=d.mact;if(a==="calma")openCalma("60");else if(a==="prio")act("elegirPrio");else if(a==="diario")location.hash="#/diario";else if(a==="enfoque")focusPicker("Sesión de enfoque");return;}
 if(d.calma){openCalma(d.calma);return;}

 if(d.merge){const c=window._cloudPending;cerrarOv();if(d.merge==="cloud"&&c){applyCloud(c);render();toast("☁️ Usando el progreso de tu cuenta");}else{S.acct=SESSION.user.id;pushSync();toast("📱 Usando el progreso de este dispositivo");}window._cloudPending=null;return;}
});
